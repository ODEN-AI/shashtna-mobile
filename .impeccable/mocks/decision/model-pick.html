<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,height=844">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body { background: #0b0e17; color: #ebe4d2; font-family: "Noto Sans Arabic", system-ui, sans-serif; }
  .glaze { height: 330px; background: #0b1640; padding: 44px 24px 0; position: relative; }
  .glaze::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 80% 0%, rgba(31,79,214,.55), rgba(31,79,214,0) 60%); }
  .row { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
  .row .name { font-size: 15px; color: #b8c4e6; }
  .row .name b { display: block; font-size: 20px; color: #ebe4d2; }
  .row .bell { width: 48px; height: 48px; border-radius: 24px; border: 1px solid rgba(214,168,74,.6); }
  .big { position: relative; z-index: 1; margin-top: 34px; }
  .big small { font-size: 15px; color: #b8c4e6; }
  .big strong { display: block; font-size: 84px; line-height: 1.05; font-weight: 800; color: #d6a84a; letter-spacing: -2px; }
  .big span { font-size: 16px; color: #ebe4d2; }
  .frieze { height: 14px; background: repeating-linear-gradient(90deg, #d6a84a 0 10px, #0b1640 10px 14px, #d6a84a 14px 16px, #0b1640 16px 26px); opacity: .85; }
  .body { padding: 22px 24px; }
  .cta { height: 56px; border-radius: 14px; background: #d6a84a; color: #0b1640; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: 800; }
  .panel { margin-top: 18px; background: #ebe4d2; color: #0b1640; border-radius: 16px; padding: 16px 18px; }
  .panel h3 { font-size: 16px; display: flex; justify-content: space-between; }
  .panel h3 span { font-size: 13px; color: #4b5a86; font-weight: 600; }
  .steps { display: flex; gap: 8px; margin-top: 14px; }
  .steps div { flex: 1; height: 6px; border-radius: 3px; background: #1f4fd6; }
  .steps div.todo { background: #c9c0a8; }
  .panel p { margin-top: 10px; font-size: 13px; color: #34406a; }
  .tabs { position: absolute; bottom: 0; right: 0; left: 0; height: 80px; background: #0b1640; display: flex; justify-content: space-around; padding-top: 14px; font-size: 12px; color: #8b97c2; }
  .tabs .on { color: #d6a84a; font-weight: 700; }
  .tabs div::before { content: ""; display: block; width: 22px; height: 22px; margin: 0 auto 4px; border: 2px solid currentColor; border-radius: 6px; }
</style>
</head>
<body>
  <div class="glaze">
    <div class="row"><div class="name">مساء الخير<b>أبو علي</b></div><div class="bell"></div></div>
    <div class="big"><small>اشتراكك IPTV · سنة</small><strong>47 يوم</strong><span>ينتهي ٣١ كانون الأول ٢٠٢٦</span></div>
  </div>
  <div class="frieze"></div>
  <div class="body">
    <div class="cta">جدّد اشتراكك</div>
    <div class="panel">
      <h3>طلب التجديد #1042 <span>نتحقق من الحوالة</span></h3>
      <div class="steps"><div></div><div></div><div class="todo"></div></div>
      <p>عادةً نخلص خلال ساعة بوقت الدوام. راح يوصلك إشعار.</p>
    </div>
  </div>
  <div class="tabs"><div class="on">اشتراكي</div><div>المتجر</div><div>مساعدة</div></div>
</body>
</html>
