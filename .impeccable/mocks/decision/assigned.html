<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,height=844">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body { background: #0b0e17; color: #f4f6fb; font-family: "Noto Sans Arabic", system-ui, sans-serif; }
  .status { height: 32px; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 8px 24px 16px; }
  .hello { font-size: 15px; color: #aab2c5; }
  .hello b { display: block; color: #f4f6fb; font-size: 20px; font-weight: 700; margin-top: 2px; }
  .bell { width: 48px; height: 48px; border-radius: 24px; background: #151a26; display: grid; place-items: center; position: relative; }
  .bell::after { content: ""; position: absolute; top: 12px; left: 13px; width: 8px; height: 8px; border-radius: 4px; background: #2456e6; }
  .bell i { width: 18px; height: 18px; border: 2px solid #c9ced8; border-radius: 9px 9px 3px 3px; }
  /* The Shashtna card: real card proportions 85.6 x 54 */
  .card { margin: 0 24px; height: 216px; border-radius: 16px; background: #2456e6; position: relative; overflow: hidden; padding: 20px 22px; }
  .card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,0) 45%); }
  .card .brand { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .card .brand b { font-size: 17px; font-weight: 800; letter-spacing: .2px; }
  .card .brand span { font-size: 12px; color: #dbe5ff; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 3px 10px; }
  .card .days { position: relative; margin-top: 18px; display: flex; align-items: baseline; gap: 10px; }
  .card .days strong { font-size: 76px; line-height: 1; font-weight: 800; letter-spacing: -2px; }
  .card .days em { font-style: normal; font-size: 18px; color: #e3eaff; }
  .strip { position: absolute; right: 22px; left: 22px; bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  .scratch { height: 30px; border-radius: 6px; background: #c9ced8; color: #20283b; font-size: 13px; font-weight: 700; padding: 6px 12px; }
  .seal { width: 34px; height: 34px; border-radius: 17px; border: 2px solid #d9b46a; display: grid; place-items: center; color: #d9b46a; font-size: 15px; font-weight: 800; }
  .renew { margin: 20px 24px 0; height: 56px; border-radius: 14px; background: #f4f6fb; color: #0b0e17; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 800; }
  .renew small { font-size: 13px; font-weight: 600; color: #4a5470; }
  .section { margin: 28px 24px 10px; display: flex; justify-content: space-between; color: #aab2c5; font-size: 14px; }
  .section b { color: #f4f6fb; font-size: 16px; }
  .order { margin: 0 24px; background: #151a26; border-radius: 16px; padding: 16px 18px; }
  .order .head { display: flex; justify-content: space-between; font-size: 15px; }
  .order .head span { color: #aab2c5; font-size: 13px; }
  .track { display: flex; align-items: center; margin: 18px 4px 10px; }
  .dot { width: 14px; height: 14px; border-radius: 7px; background: #2456e6; flex: none; }
  .dot.now { box-shadow: 0 0 0 5px rgba(36,86,230,.25); }
  .dot.todo { background: #2a3142; }
  .line { height: 3px; flex: 1; background: #2456e6; }
  .line.todo { background: #2a3142; }
  .labels { display: flex; justify-content: space-between; font-size: 12px; color: #aab2c5; }
  .labels b { color: #f4f6fb; font-weight: 700; }
  .note { margin-top: 12px; font-size: 13px; color: #c9ced8; }
  .tabs { position: absolute; bottom: 0; right: 0; left: 0; height: 80px; background: #10131d; border-top: 1px solid #1d2232; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #8a92a6; width: 96px; }
  .tab i { width: 64px; height: 30px; border-radius: 15px; display: block; }
  .tab.on { color: #f4f6fb; font-weight: 700; }
  .tab.on i { background: rgba(36,86,230,.28); }
  .tab i::after { content: ""; display: block; width: 20px; height: 20px; margin: 5px auto; border-radius: 6px; border: 2px solid currentColor; }
</style>
</head>
<body>
  <div class="status"></div>
  <div class="top">
    <div class="hello">هلا بيك<b>أبو علي</b></div>
    <div class="bell"><i></i></div>
  </div>

  <div class="card">
    <div class="brand"><b>شاشتنا</b><span>IPTV · سنة</span></div>
    <div class="days"><strong>47</strong><em>يوم باقي</em></div>
    <div class="strip">
      <div class="scratch">ينتهي ٣١ كانون الأول ٢٠٢٦</div>
      <div class="seal">ش</div>
    </div>
  </div>

  <div class="renew">جدّد اشتراكك <small>من 15,000 د.ع</small></div>

  <div class="section"><b>طلبك الحالي</b><span>#1042</span></div>
  <div class="order">
    <div class="head"><b>تجديد IPTV سنة</b><span>قبل ساعتين</span></div>
    <div class="track">
      <div class="dot"></div><div class="line"></div>
      <div class="dot now"></div><div class="line todo"></div>
      <div class="dot todo"></div>
    </div>
    <div class="labels"><span>استلمنا الحوالة</span><b>نتحقق منها</b><span>نفعّل</span></div>
    <div class="note">عادةً نخلص خلال ساعة بوقت الدوام. راح يوصلك إشعار.</div>
  </div>

  <div class="tabs">
    <div class="tab on"><i></i>اشتراكي</div>
    <div class="tab"><i></i>المتجر</div>
    <div class="tab"><i></i>مساعدة</div>
  </div>
</body>
</html>
