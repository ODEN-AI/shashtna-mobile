appId: app.shashtna.mobile
---
- launchApp
- tapOn: "الباقات"
- tapOn:
    text: ".*د.ع.*"
    index: 0
- tapOn:
    id: "order-package"
- tapOn:
    id: "confirm-order"
- assertVisible: "ادفع بالتحويل"
- assertVisible: "رقم التحويل"
- tapOn: "نسخ"
- assertVisible: "تم النسخ"
- tapOn: "اختيار من الصور"
# Pick the first image in the system picker (device must have one).
- tapOn:
    id: ".*thumbnail.*"
    index: 0
    optional: true
- tapOn:
    id: "upload-proof"
- assertVisible: "قيد مراجعة الدفع"
